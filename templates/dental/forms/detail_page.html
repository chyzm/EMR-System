{% extends 'base.html' %}

{% block content %}
<div class="mx-auto max-w-4xl rounded-xl border bg-white p-6 shadow-sm">
  <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
      <p class="text-gray-600">{{ patient.full_name }} • {{ patient.patient_id }}</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="{% url 'DurielDentalApp:dental_file_edit' file_type object.pk %}" class="rounded-lg border px-4 py-2 text-sm hover:bg-gray-50">Edit</a>
      <a href="{% url 'DurielDentalApp:dental_file_pdf' file_type object.pk %}" class="rounded-lg bg-blue-600 px-4 py-2 text-sm text-white hover:bg-blue-700">Export PDF</a>
      <a href="{% url 'DurielDentalApp:patient_chart' patient.patient_id %}" class="rounded-lg border px-4 py-2 text-sm hover:bg-gray-50">Back</a>
    </div>
  </div>

  <div class="space-y-4">
    {% for label, value in sections %}
      {% if value %}
        <section class="rounded-lg border p-4">
          <h2 class="mb-2 text-sm font-semibold uppercase text-gray-500">{{ label }}</h2>
          <div class="whitespace-pre-line text-gray-800">{{ value }}</div>
        </section>
      {% endif %}
    {% endfor %}
  </div>
</div>
{% endblock %}
